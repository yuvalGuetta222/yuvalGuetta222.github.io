🚆 רכבות ונסיעות:
• טוקיו ⬅️ קיוטו (רכבת שינקנסן): להזמין חודש מראש. חובה להזמין מקומות מסומנים עם מקום למזוודות גדולות (Oversized Baggage). טיפ: בקשו מושבים בצד ימין של הרכבת (מושב E) כדי לראות את הר פוג'י בדרך!
• טוקיו ⬅️ קוואגוצ'יקו (פוג'י): אוטובוס או רכבת (Fuji Excursion) - להזמין כחודש מראש.
• קיוטו ⬅️ אוסקה / קיוטו ⬅️ נארה: אלו רכבות מקומיות (כ-45 דקות נסיעה). אין צורך להזמין מראש, פשוט מעבירים כרטיס Suica/Pasmo דיגיטלי בטלפון.

• מוזיאון TeamLab Borderless (טוקיו): חובה להזמין חודשיים מראש ברגע שהתאריכים נפתחים, הכרטיסים אוזלים מהר.`,

🎟️ אטרקציות: מה חובה להזמין מראש ומתי?
1. מוזיאון TeamLab Borderless בטוקיו (7.3)
• מתי להזמין: חודשיים מראש (הכרטיסים למרץ ייפתחו במהלך חודש ינואר).
• למה: זהו המוזיאון המבוקש ביותר ביפן, והכרטיסים אוזלים שבועות מראש. אין קופות במקום.
• איך: דרך האתר הרשמי או אפליקציית Klook. יש לשריין שעת כניסה ספציפית (מומלץ ל-10:00 בבוקר כדי לשמור על הלו״ז המתוכנן).

2. אקווריום קאיוקאן (Kaiyukan) באוסקה (14.3)
• מתי להזמין: 30 יום מראש (ב-12 בפברואר ייפתחו הכרטיסים ל-14 במרץ).
• למה: הכרטיסים נמכרים לפי חלונות זמן של 15 דקות. הקופות במקום עמוסות מאוד ולרוב השעות המבוקשות אוזלות באותו היום.
• איך: באתר הרשמי (מערכת Webket) או ב-Klook. לפי הלו״ז, כדאי לשריין כניסה ל-15:30 או 16:00.

3. טירת ניג'ו בקיוטו (13.3) וטירת אוסקה (14.3)
• מתי להזמין: יום-יומיים מראש (אפשר גם תוך כדי הטיול מהמלון).
• למה: לא חובה להזמין חודשים מראש כי המקום לא ייגמר, אבל קניית כרטיס דיגיטלי (QR) ב-Klook או באתרים הרשמיים תחסוך לכם את העמידה בתורים הארוכים של קופות הכרטיסים הפיזיות בבוקר.
• שאר האתרים במסלול (מקדשים בקיוטו, פושימי אינארי, שווקים) אינם דורשים או אינם מאפשרים הזמנה מראש – התשלום נעשה במזומן/כרטיס בכניסה.

🚅 תחבורה בין-עירונית: מה חובה להזמין מראש?
1. רכבת שינקנסן מטוקיו לקיוטו (9.3)
• מתי להזמין: בדיוק חודש מראש (ב-9 בפברואר).
• למה חובה: אתם חייבים לשריין מושבים בשורה האחרונה של הקרון (Oversized Baggage Area) כדי שיהיה לכם איפה להניח את המזוודות הגדולות. ללא שריון כזה, אסור לעלות עם מזוודה גדולה לרכבת וקנס כספי עשוי להיות מופעל.
• איך: דרך האתר או האפליקציה הרשמית Smart-EX. בעת ההזמנה, בקשו מושב בצד E (ימין) כדי לראות את הר פוג'י מהחלון!

2. יום הטיול להר פוג'י – קוואגוצ'יקו (5.3)
• מתי להזמין: חודש מראש.
• מה להזמין: אם בוחרים ברכבת הישירה (Fuji Excursion), מזמינים באתר JR East. אם בוחרים באוטובוס, מזמינים באתר Highwaybus.com.
• הערה חשובה ללו״ז שלכם: מכיוון שהיום הזה תלוי במזג האוויר, מומלץ להזמין מראש כדי להבטיח מקום, אך להיות מוכנים לשלם דמי ביטול סמליים (כמה שקלים בודדים) ולשנות את התאריך או לבטל יומיים לפני אם התחזית מראה עננות כבדה.`,
  cautions:[
    {label:'מזוודות בשינקנסן',text:'לפי JR Central, מקום ייעודי למזוודה גדולה דורש הזמנה כשסכום שלושת ממדי המזוודה 161–250 ס״מ. מתחת ל־160 ס״מ אין חובה אוטומטית.',url:'https://global.jr-central.co.jp/en/info/oversized-baggage/index.html'},

    {label:'רכבת הבוקר לשדה',text:'יש רכבת Airport Express ב־05:15 בלוח שנבדק, אך לוח מרץ 2027, הרציף וזמן ההליכה מהמלון מחייבים אימות נוסף.',url:'https://kensaku.nankai.co.jp/sp/T5?USR=PC&d=1&dw=1&slCode=306-0'},
    {label:'TeamLab ומועדי פתיחת מכירה',text:'האתר הרשמי מתאר מכירה שמתחילה בדרך כלל בראשית החודש, חודשיים קודם, וביקוש גבוה. צריך לבדוק זמינות בפועל.',url:'https://www.teamlab.art/e/tokyo/'},
    {label:'שעות ומעברים',text:'זמני נסיעה מקוריים, מחירי כניסה ושעות פתיחה משתנים. לפני כל יום, אמתו ניווט ולוחות זמנים בשירות רשמי.',url:''}
  ]
};

document.addEventListener("DOMContentLoaded", function(){
/* Our Honeymoon: אתר סטטי RTL עם סנכרון Supabase אופציונלי */
(() => {
'use strict';
const T=window.TRIP, CONF=window.HONEYMOON_CONFIG||{};
const KEY='honeymoon2027.state.v2', CLOUDKEY='honeymoon2027.trip.v1';
const $=(s,root=document)=>root.querySelector(s), $$=(s,root=document)=>[...root.querySelectorAll(s)];
const newId=()=>window.crypto?.randomUUID?.()||'x'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const mapsLink=name=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(name);

let state=defaultData();try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(_e){}
let tab='home',selectedDate='2027-03-04',regionView='',map=null,pins=[],remoteTrip=localStorage.getItem(CLOUDKEY)||'',client=null,session=null,channel=null,uploading=false;
let toastTimer=0,refreshTimer=0;
const PENDINGKEY='honeymoon2027.pending.v1';
let pending=new Set(JSON.parse(localStorage.getItem(PENDINGKEY)||'[]'));
function storePending(){localStorage.setItem(PENDINGKEY,JSON.stringify([...pending]))}
const tips=['צלמו תמונה זוגית באותו מקום, פעם בתחילת היום ופעם בסוף ♡','חפשו בית קפה קטן שלא נמצא במסלול, ותנו לו שם סודי','בחרו פריט קטן שיזכיר לכם את העיר הזאת','ספרו אחד לשני מה היה הרגע הכי יפה של היום','בחרו שיר שהכי מתאים לנוף שבדרך','צלמו תמונה עם משהו בצבע אדום'];

const activeDay=()=>T.days.find(d=>d.date===todayISO())?.date|| (todayISO()<T.start?T.start:'2027-03-15');
function orderedDay(date){const d=T.days.find(v=>v.date===date);if(!d)return null;if(state.swapFuji&&['2027-03-05',state.swapFuji].includes(date)){const match=date==='2027-03-05'?state.swapFuji:'2027-03-05';const other=T.days.find(v=>v.date===match);return {...other,date,swappedFrom:other.date}}return d}
function persist(section){localStorage.setItem(KEY,JSON.stringify(state));if(section&&remoteTrip&&session){pending.add(section);storePending();if(client&&navigator.onLine)cloudWrite(section).then(()=>{pending.delete(section);storePending();updateSyncLabel()}).catch(e=>toast('הנתון שמור מקומית, הסנכרון ממתין לרשת'))}updateSyncLabel()}
function toast(msg){const e=$('#toast');e.textContent=msg;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3600)}
function navigate(next,date){tab=next;if(date){selectedDate=date;regionView='';}$$('[data-tab]').forEach(e=>e.classList.toggle('active',e.dataset.tab===tab));$('#main')?.scrollTo({top:0,behavior:'smooth'});window.scrollTo({top:0,behavior:'smooth'});render()}
function button(label,action,variant='btn-dark'){return `<button class="btn ${variant}" data-action="${esc(action)}">${label}</button>`}
function sectionHeader(eyebrow,title,description=''){return `<div class="page-heading"><div><span class="eyebrow">${eyebrow}</span><h1 class="section-title">${title}</h1>${description?`<p class="lead">${description}</p>`:''}</div></div>`}
function kv(msg,cls=''){return `<div class="notice ${cls}">${msg}</div>`}
function home(){const days=Math.max(0,Math.ceil((new Date(T.start+'T00:00:00+09:00')-Date.now())/86400000));const visited=Object.values(state.visited).filter(Boolean).length;const totalStops=T.days.reduce((n,d)=>n+d.stops.length,0);const curr=orderedDay(activeDay());return `<div class="page">
<div class="hero"><div class="hero-copy"><span class="topline">A LITTLE ADVENTURE, A LOT OF LOVE ♡</span><h1>העולם <em>שלנו.</em><br>המסע שלנו.</h1><p>מיפן ועד וייטנאם, כל תחנה, כל רגע קטן וכל זיכרון במקום אחד.</p><div class="hero-buttons"><button class="btn btn-light" data-tab="journey">יוצאים לדרך ↗</button><button class="btn btn-outline" style="color:white;border-color:#ffffff75" data-tab="bookings">ההזמנות שלנו ◇</button></div></div><div class="hero-art"><div class="sun"></div><div class="mountain-back"></div><div class="mountain-front"></div><div class="japan-stamp">♡</div></div></div>
<div class="stats-grid"><div class="stat"><span>ימים עד היציאה</span><strong>${todayISO()<T.start?days:'✦'}</strong><small>${todayISO()<T.start?'ההתרגשות מתחילה':'המסע שלנו'}</small></div><div class="stat"><span>ימי מסלול מפורטים</span><strong>12</strong><small>יפן · 4–15 במרץ</small></div><div class="stat"><span>עצירות שסימנו</span><strong>${visited}/${totalStops}</strong><small>כל רגע נספר</small></div><div class="stat"><span>מדינות במסע</span><strong>02</strong><small>יפן & וייטנאם</small></div></div>
<div class="split"><section class="panel"><div class="row-between"><div><span class="eyebrow">THE JOURNEY</span><h3>המסע שלנו, פרק אחרי פרק</h3></div><button class="mini-btn" data-tab="journey">לכל הימים ←</button></div>
${T.hotels.map((h,i)=>`<div class="city-card"><div class="city-emoji">${['🗼','⛩️','🐙'][i]}</div><div><b>${esc(h.city)} <small> · ${h.date}</small></b><small>${esc(h.name)}</small></div><button class="mini-btn arrow" data-action="goDate" data-date="${['2027-03-04','2027-03-09','2027-03-13'][i]}" title="פתח יום">↗</button></div>`).join('')}
<div class="city-card"><div class="city-emoji">🌿</div><div><b>וייטנאם <small> · 15–25.3</small></b><small>המשך המסלול עדיין לא נמסר</small></div></div></section>
<section style="display:flex;flex-direction:column;gap:16px"><div class="countdown"><span class="kicker">COUNTING DOWN TO FOREVER</span><strong>${todayISO()<T.start?days+' DAYS':'♡'}</strong><small>עד שהמסע שלנו מתחיל</small></div><div class="panel"><span class="eyebrow">TODAY'S NOTE</span><h3>הרגע הקטן שלנו ✳</h3><p class="subtle">${tips[new Date().getDate()%tips.length]}</p><button class="btn btn-soft btn-small" data-tab="memories">לזיכרונות שלנו ♡</button></div></section></div>
<div class="section-head"><h2>היום שלנו <span style="color:var(--rose)">✳</span></h2><button class="mini-btn" data-action="goDate" data-date="${curr.date}">לפתיחת היום ↗</button></div>
<div class="panel"><div class="row-between"><div><span class="pill warm">${fmtDate(curr.date)} · ${esc(curr.city)}</span><h3 style="margin-top:10px">${curr.emoji} ${esc(curr.title)}</h3><p class="subtle">${esc(curr.subtitle)}</p></div><span style="font-size:50px">${curr.emoji}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.round(curr.stops.filter((s,i)=>state.visited[curr.date+':'+i]).length/Math.max(curr.stops.length,1)*100)}%"></div></div><div class="row-between"><small class="subtle">${curr.stops.filter((s,i)=>state.visited[curr.date+':'+i]).length} מתוך ${curr.stops.length} תחנות הושלמו</small>${button('צפה במפה','goToday','btn-dark btn-small')}</div></div>
<div class="section-head"><h2>לפני שיוצאים</h2><button class="mini-btn" data-tab="bookings">לכל ההזמנות ←</button></div><div class="cards-grid">${T.bookings.slice(0,2).map(bookingCard).join('')}</div>
</div>`}
function journey(){if(regionView)return regionPage(regionView);const d=orderedDay(selectedDate)||T.days[0], date=d.date, n=d.stops.length;const nvisited=d.stops.filter((s,i)=>state.visited[(d.swappedFrom||date)+':'+i]).length;return `<div class="page">${sectionHeader('YOUR ADVENTURE / ITINERARY','כל יום הוא סיפור אחר','המפה מסודרת לפי סדר הביקורים שהגדרתם. לחצו על נקודה כדי לזהות אותה, ועל ניווט כדי להגיע אליה בפועל.')}
<div class="cities"><button class="chip ${d.city==='טוקיו'?'selected':''}" data-action="city" data-city="טוקיו">🗼 טוקיו</button><button class="chip ${d.city==='קיוטו'?'selected':''}" data-action="city" data-city="קיוטו">⛩️ קיוטו</button><button class="chip ${d.city==='אוסקה'?'selected':''}" data-action="city" data-city="אוסקה">🐙 אוסקה</button><button class="chip" data-action="vietnam">🌿 וייטנאם</button></div>
<div class="action-bar"><button class="btn btn-soft btn-small" data-action="region" data-city="${d.city==='מעבר'?'אוסקה':d.city}">🗺️ מפת כל אזור ${d.city==='מעבר'?'אוסקה':d.city} ↗</button></div>
<div class="day-scroll">${T.days.map(x=>{const val=orderedDay(x.date);return `<button class="day-tile ${date===x.date?'selected':''}" data-action="day" data-date="${x.date}"><span class="tile-emoji">${val.emoji}</span><strong>${dayNum(x.date)}.3</strong><small>${esc(val.city)}</small></button>`}).join('')}</div>
<div class="day-head"><div><span class="day-label">יום ${T.days.findIndex(x=>x.date===date)+1} · ${fmtDate(date)} ${d.swappedFrom?'· הוחלף':''}</span><h2>${d.emoji} ${esc(d.title)}</h2><p class="subtle">${esc(d.subtitle)}</p></div><div class="small-stack"><span class="pill">${n} תחנות</span><span class="pill warm">${nvisited} הושלמו</span></div></div>
${d.hotel?`<div class="small-stack" style="margin:0 0 14px"><span class="chip">⌂ מלון: ${esc(d.hotel)}</span><a class="text-link" target="_blank" rel="noopener" href="${mapsLink(d.hotel)}">למיקום המלון ↗</a></div>`:''}
${d.swappedFrom?kv('הצגת מסלול שהועבר מתאריך '+fmtDate(d.swappedFrom)+'. ההזמנות המקוריות אינן משתנות אוטומטית; בדקו כרטיסים לפני שינוי.','warning'):''}
${d.note?`<div class="notice warning" style="margin-bottom:16px"><strong>⚑ הערת תכנון</strong><p>${esc(d.note)}</p></div>`:''}
<div class="weather" style="margin:0 0 16px"><span style="font-size:30px">☁</span><div><strong>תחזית למועד הטיול</strong><small id="weather-line">בודק זמינות תחזית...</small></div></div>
<div class="map-layout"><div><div class="map-wrap"><div class="real-map" id="map"></div><div class="map-help">הקו בין הנקודות להמחשת הסדר בלבד, לא מסלול נסיעה. מפה חיה דורשת אינטרנט; ניווט נפתח במפות.</div></div><div class="action-bar"><button class="btn btn-outline btn-small" data-action="focusMap">מקד את כל התחנות ⤢</button><a class="btn btn-outline btn-small" href="${mapsLink(d.stops[0].name)}" target="_blank" rel="noopener">פתח נקודת התחלה ↗</a></div></div>
<div class="panel"><div class="row-between"><h3>תחנה אחר תחנה</h3><span class="pill">${nvisited}/${n} ✓</span></div><div class="stop-list">${d.stops.map((s,i)=>`<div class="stop ${state.visited[(d.swappedFrom||date)+':'+i]?'visited':''}"><div class="stop-num">${state.visited[(d.swappedFrom||date)+':'+i]?'✓':(s.type==='food'?'🍜':s.type==='optional'?'☆':d.stops.slice(0,i+1).filter(p=>p.type!=='food'&&p.type!=='optional').length)}</div><div class="stop-body"><span class="time">${esc(s.time||'לפי הלו״ז')}</span><h4>${esc(s.name)}${['food','optional'].includes(s.type)?'<span class="pill warm" style="margin-right:6px">אפשרות לבחירה</span>':''}</h4><p>${esc(s.desc)}</p><div class="stop-actions"><a href="${mapsLink(s.name+(d.city==='טוקיו'?' Tokyo Japan':d.city==='קיוטו'?' Kyoto Japan':' Osaka Japan'))}" target="_blank" rel="noopener">ניווט ↗</a><button data-action="locate" data-index="${i}">הצג במפה ◎</button><button class="${state.visited[date+':'+i]?'done':''}" data-action="visit" data-index="${i}">${state.visited[(d.swappedFrom||date)+':'+i]?'✓ ביקרנו':'סמן שביקרנו'}</button></div></div></div>`).join('')}</div></div></div>
<details class="detail-toggle"><summary>📄 הצג את כל התכנון המקורי ליום הזה, ללא קיצורים</summary><div class="original-text">${esc(d.original)}</div></details>
${date==='2027-03-05'||date==='2027-03-08'?fujiSwap():''}

function renderMap(){const d=regionView?{stops:regionItems(regionView)}:orderedDay(selectedDate);if(tab!=='journey'||!$('#map')||!d)return;const box=$('#map');if(!window.L){box.innerHTML='<div class="map-fallback"><span style="font-size:52px">🗺️</span><strong>לא ניתן לטעון כרגע את המפה האינטראקטיבית</strong><small>המסלול וניווט לכל תחנה עדיין זמינים ברשימה</small></div>';return}try{map=L.map(box,{scrollWheelZoom:false,zoomControl:true});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);const coords=d.stops.filter(p=>p.type!=='food'&&p.type!=='optional').map(p=>[p.lat,p.lng]);const l=L.polyline(coords,{color:'#d97865',weight:3,opacity:.78,dashArray:'6 8'}).addTo(map);d.stops.forEach((s,i)=>{const label=s.type==='food'?'🍜':s.type==='optional'?'☆':d.stops.slice(0,i+1).filter(p=>p.type!=='food'&&p.type!=='optional').length;const pin=L.marker([s.lat,s.lng],{icon:L.divIcon({html:`<div class="map-pin" style="${['food','optional'].includes(s.type)?'background:#b87a61':''}"><span>${label}</span></div>`,className:'',iconSize:[34,34],iconAnchor:[16,29]})}).addTo(map);pin.bindPopup(`<div style="font-family:Arial;text-align:right;min-width:110px"><b>${label}. ${esc(s.name)}</b><br><span>${esc(s.time||'')}</span><br><a href="${mapsLink(s.name+' Japan')}" target="_blank" rel="noopener">ניווט ↗</a></div>`);pins.push(pin)});let visible=coords;if(regionView==='טוקיו'||(!regionView&&selectedDate==='2027-03-05'))visible=coords.filter(x=>x[1]>138.5&&(regionView?x[1]>139.3:x[1]<139.3));if(!regionView&&selectedDate==='2027-03-09')visible=coords.filter(x=>x[1]<136);if(!regionView&&selectedDate==='2027-03-13')visible=coords.filter(x=>x[0]<34.9);map.fitBounds(L.latLngBounds(visible.length?visible:coords),{padding:[34,35],maxZoom:15});setTimeout(()=>map?.invalidateSize(),200)}catch(e){box.innerHTML='<div class="map-fallback">המפה אינה זמינה כרגע. אפשר עדיין לפתוח ניווט מכל תחנה.</div>';console.warn(e)}}

function attachListeners(){document.addEventListener('click',async e=>{const b=e.target.closest('[data-tab],[data-action]');if(!b)return;if(b.dataset.tab){navigate(b.dataset.tab);return}const a=b.dataset.action;if(!a)return;
if(a==='day'){regionView='';selectedDate=b.dataset.date;render();return}if(a==='city'||a==='region'){regionView=b.dataset.city;render();return}if(a==='backToDay'){regionView='';render();return}if(a==='goDate'){navigate('journey',b.dataset.date);return}if(a==='goToday'){navigate('journey',activeDay());return}if(a==='vietnam'){showModal(`<h2>🌿 וייטנאם · 15–25.3</h2><p class="subtle">${esc(T.vietnam.description)}</p>`);return}if(a==='visit'){const id=(orderedDay(selectedDate).swappedFrom||selectedDate)+':'+b.dataset.index;state.visited[id]=!state.visited[id];persist('visited');render();return}if(a==='locateRegion'){const idx=Number(b.dataset.index),s=regionItems(regionView)[idx];map?.setView([s.lat,s.lng],15);pins[idx]?.openPopup();return}if(a==='locate'){const idx=Number(b.dataset.index);map?.setView([orderedDay(selectedDate).stops[idx].lat,orderedDay(selectedDate).stops[idx].lng],15);pins[idx]?.openPopup();return}if(a==='focusMap'){if(map){const d=regionView?{stops:regionItems(regionView)}:orderedDay(selectedDate);map.fitBounds(L.latLngBounds(d.stops.map(p=>[p.lat,p.lng])),{padding:[35,35],maxZoom:15})}return}if(a==='booking'){goBooking(b.dataset.id);return}if(a==='swapFuji'){state.swapFuji=state.swapFuji?'':'2027-03-08';persist('settings');render();toast(state.swapFuji?'הימים הוחלפו בתצוגה, יש לבדוק כרטיסים':'הוחזר המסלול המקורי');return}
if(a==='deleteExpense'){if(!confirm('למחוק את ההוצאה?'))return;state.expenses=state.expenses.filter(x=>x.id!==b.dataset.id);persist('expenses');render();return}if(a==='deleteMemory'){if(!confirm('למחוק את הזיכרון?'))return;state.memories=state.memories.filter(x=>x.id!==b.dataset.id);persist('memories');render();return}if(a==='export'){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='honeymoon-backup-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000);toast('נוצר גיבוי נתונים');return}if(a==='refreshCloud'){await cloudRead();render();return}if(a==='logout'){await client?.auth.signOut();remoteTrip='';localStorage.removeItem(CLOUDKEY);pending.clear();storePending();session=null;render();return}if(a==='createCloudTrip'){await createTrip();return}if(a==='invite'){await showInvite();return}

async function importBackup(file){if(!file)return;try{const parsed=JSON.parse(await file.text());if(parsed.version!==2||!parsed.state||!Array.isArray(parsed.state.expenses)||!Array.isArray(parsed.state.memories)||typeof parsed.state.visited!=='object')throw Error('קובץ גיבוי לא תקין');if(!confirm('לייבא גיבוי ולהחליף את הנתונים המקומיים הנוכחיים?'))return;const x=parsed.state;state={...defaultData(),...x,bookings:x.bookings||{},fx:x.fx||{}};persist();render();toast('הגיבוי נטען, תמונות אינן כלולות')}catch(e){toast(e.message)}}

async function renderWeather(d){const el=$('#weather-line');if(!el||!d)return;const target=new Date(d.date+'T12:00:00+09:00');const days=(target-Date.now())/86400000;if(days>15.5){el.textContent='מוקדם מדי לתחזית אמינה. תחזית אוטומטית תוצג כ־16 יום לפני התאריך; לפוג׳י כדאי לבדוק גם עננות ונראות 48 שעות לפני.';return}if(days< -1){el.textContent='זהו יום שכבר חלף. אין תחזית עתידית לתאריך זה.';return}if(!navigator.onLine){el.textContent='אין כרגע חיבור לקבלת תחזית. יתר המסלול זמין אופליין.';return}const coord=d.city==='טוקיו'?[35.69,139.7]:d.city==='קיוטו'?[35.01,135.76]:[34.67,135.5];try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coord[0]}&longitude=${coord[1]}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,cloud_cover_mean&timezone=Asia%2FTokyo&forecast_days=16`);if(!r.ok)throw Error('weather unavailable');const v=await r.json();const i=v.daily?.time?.indexOf(d.date);if(i<0)throw Error('date unavailable');if(!el.isConnected)return;el.textContent=`${v.daily.temperature_2m_min[i]}°–${v.daily.temperature_2m_max[i]}° · סיכוי לגשם ${v.daily.precipitation_probability_max[i]}% · עננות ממוצעת ${v.daily.cloud_cover_mean[i]}%. תחזית משתנה; עננות אינה מבטיחה נראות של פוג׳י.`}catch(_){if(el.isConnected)el.textContent='התחזית לא זמינה כרגע. כדאי לבדוק שוב בהמשך.'}}
async function loadFujiWeather(){const until=(new Date('2027-03-05T12:00:00+09:00')-Date.now())/86400000;if(until>16||until<0)return;try{const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=35.517&longitude=138.755&daily=weather_code,cloud_cover_mean,temperature_2m_max&timezone=Asia%2FTokyo&forecast_days=16');if(!r.ok)return;const x=await r.json(),i=x.daily?.time?.indexOf('2027-03-05');if(i<0)return;const e=$('#fuji-weather');if(e)e.textContent=`תחזית קוואגוצ׳יקו ב־5.3: עננות ממוצעת ${x.daily.cloud_cover_mean[i]}%, מקסימום ${x.daily.temperature_2m_max[i]}°C. נראות פוג׳י לא מובטחת.`}catch(_){}}

let idbPromise=null;
function db(){if(!('indexedDB'in window))return Promise.reject(Error('אחסון תמונות מקומי לא נתמך'));if(!idbPromise)idbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('honeymoon-media',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return idbPromise}
async function saveMedia(id,file){const database=await db();await new Promise((resolve,reject)=>{const tx=database.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function getMedia(id){const database=await db();return new Promise((resolve,reject)=>{const r=database.transaction('files','readonly').objectStore('files').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function addMemory(form){const o=new FormData(form),photo=o.get('photo');const mem={id:newId(),date:o.get('date'),title:String(o.get('title')||'').slice(0,100),text:String(o.get('text')||'').slice(0,3000),photoId:'',photoPath:''};if(photo&&photo.size){if(photo.size>10*1024*1024)throw Error('תמונה עד 10MB');if(!photo.type.startsWith('image/'))throw Error('אפשר להעלות תמונה בלבד');mem.photoId=mem.id;await saveMedia(mem.id,photo);if(client&&session&&remoteTrip){try{mem.photoPath=await cloudUpload(photo,mem.id)}catch(err){toast('התמונה נשמרה מקומית; העלאה לענן נכשלה')}}}state.memories.push(mem);persist('memories');render();toast('הרגע נשמר ♡')}
async function loadPhotos(){for(const e of $$('[data-photo]')){const id=e.dataset.photo,path=e.dataset.path;if(!id&&!path)continue;try{let file=id?await getMedia(id):null,url='';if(file)url=URL.createObjectURL(file);else if(path&&client){const r=await client.storage.from('trip-media').createSignedUrl(path,3600);url=r.data?.signedUrl||''}if(url){const img=document.createElement('img');img.alt='תמונה מתוך יומן ירח הדבש';img.src=url;e.textContent='';e.appendChild(img)}}catch(err){console.warn('photo:',err)}}}

async function saveBooking(form){const id=form.dataset.id,o=new FormData(form),file=o.get('ticket'),next={...state.bookings[id],confirmation:String(o.get('confirmation')||'').slice(0,220),date:o.get('date'),time:o.get('time'),done:o.get('done')==='on'};if(file&&file.size){if(file.size>10*1024*1024)throw Error('קובץ עד 10MB');if(!file.type.startsWith('image/')&&file.type!=='application/pdf')throw Error('קובץ חייב להיות תמונה או PDF');next.ticketId='ticket-'+id;await saveMedia(next.ticketId,file);if(client&&session&&remoteTrip){try{next.ticketPath=await cloudUpload(file,next.ticketId)}catch(e){toast('הכרטיס נשמר מקומית, אך לא הועלה לענן')}}}state.bookings[id]=next;persist('bookings')}

async function showInvite(){const r=await client.from('trip_invites').select('code,used_by').eq('trip_id',remoteTrip).is('used_by',null).limit(1);if(r.error)throw r.error;if(!r.data?.length){showModal('<h2>הזמנה נוצלה</h2><p class="subtle">קוד ההזמנה נוצל או לא נמצא. הקוד נוצר להזמנה אחת בלבד.</p>');return}const code=r.data[0].code;showModal(`<h2>קוד הטיול המשותף</h2><div class="quote" style="font-family:monospace;letter-spacing:3px" dir="ltr">${esc(code)}</div><button class="btn btn-dark" id="copy-invite" data-code="${esc(code)}">העתק קוד</button>`)}
function sectionVal(n){if(n==='settings')return {fx:state.fx,swapFuji:state.swapFuji,surprises:state.surprises};return state[n]}
async function cloudWrite(n){if(!client||!remoteTrip||!session)return;const r=await client.from('trip_data').upsert({trip_id:remoteTrip,key:n,payload:sectionVal(n),updated_by:session.user.id,updated_at:new Date().toISOString()},{onConflict:'trip_id,key'});if(r.error)throw r.error}
async function flushPending(){if(!client||!remoteTrip||!session)return;for(const n of [...pending]){await cloudWrite(n);pending.delete(n);storePending()}}
async function cloudRead(){if(!client||!remoteTrip||!session)return;await flushPending();const r=await client.from('trip_data').select('key,payload').eq('trip_id',remoteTrip);if(r.error)throw r.error;for(const x of r.data||[]){if(x.key==='settings'){state.fx=x.payload.fx||{};state.swapFuji=x.payload.swapFuji||'';state.surprises=x.payload.surprises||[]}else if(['visited','bookings','expenses','memories'].includes(x.key))state[x.key]=x.payload}persist();toast('נתוני הטיול עודכנו ✓')}
function subscribe(){if(!client||!remoteTrip)return;if(channel)client.removeChannel(channel);channel=client.channel('honeymoon-'+remoteTrip).on('postgres_changes',{event:'*',schema:'public',table:'trip_data',filter:'trip_id=eq.'+remoteTrip},()=>{clearTimeout(refreshTimer);refreshTimer=setTimeout(()=>cloudRead().then(()=>render()).catch(console.warn),700)}).subscribe()}
async function cloudUpload(file,id){const ext=(file.name?.split('.').pop()||'bin').replace(/[^a-zA-Z0-9]/g,'').slice(0,6)||'bin';const path=`${remoteTrip}/${session.user.id}/${id}-${Date.now()}.${ext}`;const r=await client.storage.from('trip-media').upload(path,file,{contentType:file.type,upsert:false});if(r.error)throw r.error;return path}
document.addEventListener('click',e=>{if(e.target.id==='copy-invite'){navigator.clipboard?.writeText(e.target.dataset.code).then(()=>toast('קוד השיתוף הועתק'))}});
function boot(){selectedDate=activeDay();attachListeners();updateNetwork();render();initCloud().then(()=>render());if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(console.warn)}
boot();
})();

});

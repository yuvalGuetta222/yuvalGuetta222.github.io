name: Tevuna Finance Smoke Checks
on:
  push:
    paths:
      - "finance/**"
      - ".github/workflows/tevuna-finance-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Javascript syntax
        run: |
          node --check finance/app.js
          node --check finance/importer.js
          node --check finance/import-batches.js
          node --check finance/analysis.js
          node --check finance/coach-view.js
          node --check finance/coach-engine.mjs
          node --check finance/household-ledger.mjs
          node --check finance/category-view.js
          node --check finance/category-data.mjs
          node --check finance/income-view.js
          node --check finance/income-utils.mjs
          node --check finance/credit-core.mjs
          node --check finance/financial-insights.mjs
      - name: Run statement parser and analytics tests
        run: node --test finance/*.test.mjs
      - name: Ensure required pages exist
        run: |
          test -s finance/index.html
          test -s finance/style.css
          test -s finance/app.js
          test -s finance/category-view.js
          test -s finance/income-view.js
          test -s finance/coach-view.js
